name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/bangsmackpow/abstract-etl

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run validation
        run: npm run validate

  build-backend:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Smoke test backend image
        run: |
          # Pull the image we just pushed
          docker pull ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

          # Run the app and check it doesn't crash on missing schema/files
          docker run --rm \
            -e GOOGLE_AI_API_KEY=test \
            -e JWT_SECRET=test \
            -e ADMIN_EMAIL=test@test.com \
            -e ADMIN_PASSWORD=test123 \
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} \
            node -e "
              try {
                require('./src/index.js');
              } catch(e) {
                // Schema/prompt/file missing = fatal build issue
                if (e.message.includes('Schema') || e.message.includes('Prompt') || e.message.includes('file not found')) {
                  console.error('FATAL: ' + e.message);
                  process.exit(1);
                }
                // Other startup errors (no DB, no AI key) are expected in test
                console.log('OK - startup failed for expected reason: ' + e.message);
                process.exit(0);
              }
            "
          echo "✅ Backend smoke test passed"

  build-frontend:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Verify images exist before deploy
        run: |
          docker pull ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          docker pull ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          echo "✅ Both images verified"

      - name: Smoke test backend image
        run: |
          CONTAINER_ID=$(docker run -d --rm \
            -e GOOGLE_AI_API_KEY=test \
            -e JWT_SECRET=test \
            -e ADMIN_EMAIL=test@test.com \
            -e ADMIN_PASSWORD=test123 \
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} \
            node -e "try { require('./src/index.js') } catch(e) { if(e.message.includes('Schema')) { console.error('FAIL: '+e.message); process.exit(1) } else { console.log('OK - startup failed for expected reason: '+e.message); process.exit(0) } }")
          docker wait $CONTAINER_ID
          echo "✅ Backend smoke test passed"

      - name: Trigger Portainer Webhook
        run: |
          WEBHOOK_URL="${{ secrets.PORTAINER_WEBHOOK_URL }}"
          # Append ?pull=true if not already present
          if [[ "$WEBHOOK_URL" == *"?"* ]]; then
            WEBHOOK_URL="${WEBHOOK_URL}&pull=true"
          else
            WEBHOOK_URL="${WEBHOOK_URL}?pull=true"
          fi
          curl -X POST "$WEBHOOK_URL"
