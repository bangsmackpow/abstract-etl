apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Click a requestId value to drill straight into that request's logs
        - datasourceUid: loki
          matcherRegex: '"requestId":"([0-9a-f-]+)"'
          name: requestId
          url: '${__value.raw}'
          matcherType: regex
    editable: true
